<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rotate</title>
    <style>
#a{
    height: 200px;
    width: 200px;
    background: rgb(122, 16, 34);
    /* transform: rotate(60deg); */
        margin: 50px;
        transition:1s;
    transform-origin: center;

}
#a:hover{
transform: rotate(36000000deg);

}
    </style>
</head>
<body>
    <div id="a"></div>
</body>
</html>
